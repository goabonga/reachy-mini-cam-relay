# multicz.toml - versioning, changelog and tagging for the single
# reachy-mini-cam-relay component. Driven by Conventional Commits.
# Docs: https://goabonga.github.io/multicz/

[project]
commit_convention = "conventional"
# Keep the v-prefixed tag convention the project used under commitizen
# (tag_format = "v$version"). No tags exist yet, so the first release
# computes its version from the whole history.
tag_format = "v{version}"
initial_version = "0.0.0"
# Regenerate uv.lock after each bump so the lockfile tracks the new
# version. Without `allow`, multicz silently skips the hook and the
# next `uv sync --frozen` in CI fails on lockfile drift.
post_bump_policy = "allow"
state_file = ".multicz/state.json"

[project.bump_rules]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"
deprecate = "minor"
remove = "minor"

# CHANGELOG layout aligned on Keep-a-Changelog. multicz routes each
# commit to the section whose `types` list contains its type. Order
# matters: sections render in declaration order.
[[project.changelog_sections]]
title = "Added"
types = ["feat"]

[[project.changelog_sections]]
title = "Deprecated"
types = ["deprecate"]

[[project.changelog_sections]]
title = "Removed"
types = ["remove"]

[[project.changelog_sections]]
title = "Fixed"
types = ["fix"]

[[project.changelog_sections]]
title = "Performance"
types = ["perf"]

[components.reachy-mini-cam-relay]
# A commit counts toward the bump and CHANGELOG only if it touches one of
# these paths - the source, the project/deps/metadata file and the
# lockfile. uv.lock is tracked because it defines what actually ships:
# packaging/build-deb.sh exports it to debian/requirements.txt and the
# .deb bundles that venv, so a runtime dependency bump changes the
# delivered artifact and deserves a version. Dev-only bumps stay out of
# the way on their own: Dependabot labels runtime updates `fix(deps)`
# (patch) and development ones `chore(deps)`, and `chore` is not in
# bump_rules. Everything else (LICENSE, README, .github, docs, tests,
# scripts, tooling configs) is intentionally NOT tracked, so infra- or
# docs-only work never counts as a package release.
paths = ["src/**", "pyproject.toml", "uv.lock"]
bump_files = [
    { file = "pyproject.toml", key = "project.version" },
    { file = "src/reachy_mini_cam_relay/__init__.py", key = "regex:__version__\\s*=\\s*[\"']([^\"']+)[\"']" },
]
changelog = "CHANGELOG.md"
post_bump = ["uv lock"]
# No PyPI artifact: this project is distributed as a Debian package built
# in CI (see .github/workflows/ci.yml) and attached to the GitHub Release.

# Maintain debian/changelog natively: on every bump multicz prepends a
# fresh stanza (the same feat/fix/perf bullets as CHANGELOG.md), committed
# in the release commit. multicz versions are non-native (0.1.1-1), so the
# source package is "3.0 (quilt)". The version source stays the bump_files
# above; this writer is a pure sink.
[[components.reachy-mini-cam-relay.writers]]
type = "debian-changelog"
file = "debian/changelog"
distribution = "unstable"
urgency = "medium"
maintainer = "Chris <goabonga@pm.me>"
