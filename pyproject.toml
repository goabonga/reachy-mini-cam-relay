[project]
name = "reachy-mini-cam-relay"
version = "0.0.0"
description = "Relay the Reachy Mini camera, microphone and speakers as Linux virtual devices for use in any browser meeting app"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chris", email = "goabonga@pm.me" },
]
keywords = [
    "reachy",
    "reachy-mini",
    "robotics",
    "telepresence",
    "webrtc",
    "v4l2",
    "v4l2loopback",
    "virtual-camera",
    "virtual-microphone",
    "video-conferencing",
    "pulseaudio",
    "pipewire",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Conferencing",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "reachy-mini>=1.7.3",
    "pyvirtualcam>=0.11",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/goabonga/reachy-mini-cam-relay"
Repository = "https://github.com/goabonga/reachy-mini-cam-relay"
Issues = "https://github.com/goabonga/reachy-mini-cam-relay/issues"
Changelog = "https://github.com/goabonga/reachy-mini-cam-relay/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.8",
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=4",
]

[project.scripts]
reachy-mini-cam-relay = "reachy_mini_cam_relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_mini_cam_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=reachy_mini_cam_relay",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
# E501 (line length) is enforced by the formatter, not the linter.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
# Bandit gates on MEDIUM+ findings; these LOW checks are skipped because
# every hit is an intentional, reviewed pattern in a system-integration
# CLI:
#   B101 - asserts used purely to narrow Optional types for mypy.
#   B112 - try/except/continue keeps the audio loop alive across glitches.
#   B404/B603/B607 - subprocess runs PulseAudio tools (pactl/pacat/parec)
#                    resolved via shutil.which, with no shell and no
#                    user-controlled arguments.
skips = ["B101", "B112", "B404", "B603", "B607"]
