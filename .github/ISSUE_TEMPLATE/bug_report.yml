name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

  - type: input
    id: version
    attributes:
      label: reachy-mini-cam-relay version
      description: "Output of `pip show reachy-mini-cam-relay` or `uv run reachy-mini-cam-relay --version`."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue? Include the exact command line.
      placeholder: |
        1. Run `reachy-mini-cam-relay --reachy-host <ip>`
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Affected subsystem
      options:
        - Camera / video (v4l2loopback)
        - Microphone (virtual audio)
        - Speakers (virtual audio)
        - WebRTC connection / reconnection
        - Installation / setup scripts
        - Other
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python Version
      options:
        - "3.11"
        - "3.12"
        - "3.13"
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distribution
      description: "e.g. Ubuntu 24.04, Raspberry Pi OS, Fedora 41."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Traceback
      description: "Paste relevant logs (e.g. `journalctl --user -u reachy-mini-cam-relay@<host>`)."
      render: shell
